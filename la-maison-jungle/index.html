<!--
  Fichier principal HTML de l'application React "la-maison-jungle"
  Ce fichier charge le point d'entrée React et définit la structure de base du document.
-->
<!doctype html>
<html lang="fr">
  <head>
    <!-- Encodage des caractères en UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Icône de l'onglet du navigateur -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Responsive : adapte l'affichage à la taille de l'écran -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre de la page -->
    <title>la-maison-jungle</title>
  </head>
  <body>
    <!-- Point d'ancrage de l'application React -->
    <div id="root"></div>
    <!-- Chargement du code JavaScript principal de l'application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
